name: test

on: workflow_dispatch

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # default: solc 0.8.23, what gets deployed. solar: Paradigm's Rust compiler, dev loop only (see bench/solar)
        profile: [default, solar]

    name: Foundry project (${{ matrix.profile }})
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # >= 1.9.0 ships `solar` next to `forge` (the `nightly` tag stopped moving in April 2026)
          version: v1.9.0

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
